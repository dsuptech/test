<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">NETFLIX</div>
        <nav class="nav">
            <a href="#">홈</a>
            <a href="#">TV 프로그램</a>
            <a href="#">영화</a>
            <a href="#">NEW! 요즘 대세 콘텐츠</a>
            <a href="#">내가 찜한 콘텐츠</a>
        </nav>
        <div class="user-profile">
            <span>Profile</span>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">지금 뜨는 영화</h1>
            <p class="hero-desc">
                흥미진진한 스토리와 놀라운 영상미를 감상하세요. <br>
                지금 바로 시청하세요.
            </p>
            <div class="hero-buttons">
                <button class="btn btn-play">▶ 재생</button>
                <button class="btn btn-info">ⓘ 상세 정보</button>
            </div>
        </div>
    </section>

    <!-- Content Rows -->
    <section class="row">
        <h2>넷플릭스 인기 콘텐츠</h2>
        <div class="row-posters">
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
        </div>
    </section>

    <section class="row">
        <h2>지금 뜨는 콘텐츠</h2>
        <div class="row-posters">
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
        </div>
    </section>

    <section class="row">
        <h2>다시보기 추천</h2>
        <div class="row-posters">
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
            <div class="poster"></div>
        </div>
    </section>

</body>
</html>
